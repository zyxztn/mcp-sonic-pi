[project]
name = "mcp-sonic-pi"
version = "0.2.0"
description = "MCP server for Sonic Pi 5 (fork): token-aware OSC and MP3 recording"
requires-python = ">=3.10"
authors = [
    {name = "Vinayak Mehta", email = "vmehta94@gmail.com"},
]
dependencies = [
    "mcp>=1.2.0,<2",
    "python-osc>=1.9.3",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "lameenc>=1.7.0",
    "mutagen>=1.47",
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
"Homepage" = "https://github.com/vinayak-mehta/mcp-sonic-pi"
"Bug Tracker" = "https://github.com/vinayak-mehta/mcp-sonic-pi/issues"

[project.scripts]
mcp-sonic-pi = "mcp_sonic_pi.server:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mcp_sonic_pi"]
